
name: Deploy BMB Website and ADB Scanner

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preserve existing website
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='_site' \
            ./ _site/

      - name: Build ADB Scanner
        working-directory: adb-scanner
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish ADB Scanner
        run: |
          mkdir -p _site/adb-scanner
          cp -a adb-scanner/dist/. _site/adb-scanner/
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

